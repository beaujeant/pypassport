[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epassportviewer-mcp"
version = "0.1.0"
description = "MCP server for AI-assisted ePassport analysis and protocol research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Beaujeant" },
]
keywords = ["mcp", "passport", "epassport", "nfc", "smartcard", "security"]
dependencies = [
    "mcp>=2,<3",
    "pypassport",
]

[project.optional-dependencies]
reader = ["pypassport[reader]"]

[project.scripts]
epassportviewer-mcp = "epassportmcp.server:main"

[tool.uv.sources]
pypassport = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
