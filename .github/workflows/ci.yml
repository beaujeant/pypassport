name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install PC/SC build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Install workspace and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ./pypassport -e ./epassportviewer -e ./epassportmcp pytest
      - name: Test
        run: python -m pytest -m "not hardware"
      - name: Compile source
        run: python -m compileall -q pypassport/src epassportviewer/src epassportmcp/src

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check --config pyproject.toml pypassport/src epassportviewer/src epassportmcp/src

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build pypassport --outdir artifacts/pypassport
      - run: python -m build epassportviewer --outdir artifacts/epassportviewer
      - run: python -m build epassportmcp --outdir artifacts/epassportmcp
      - run: python -m twine check artifacts/*/*
