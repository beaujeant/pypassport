name: Release validation

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build pypassport --outdir dist/pypassport
      - run: python -m build epassportviewer --outdir dist/epassportviewer
      - run: python -m build epassportmcp --outdir dist/epassportmcp
      - run: python -m twine check dist/*/*
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/*/*
